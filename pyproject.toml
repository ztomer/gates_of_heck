# Python tooling configuration for the gate estate.
#
# This file exists because `check_python_formatted.py` resolves ruff's settings
# from the tree it runs in. With no configuration, ruff applied its defaults, so
# the shape of every Python file here was decided by whichever hand last edited
# it -- and the check reported 129 of 148 files unformatted while no gate ran it
# over this repository. A checker that is right about the answer and nobody asks
# it is not a gate.
#
# `[tool.ruff]` below is therefore a DECLARATION, not a preference: it is what
# "formatted" means here, so the answer stops depending on ruff's version and on
# the directory the command was launched from.
[tool.ruff]
# 100 matches the Rust side's `max_width` (see rustfmt.toml), so a line that is
# readable in one language is readable in the other. ruff's default is 88, which
# wraps the existing code for no gain: these files are mostly long string
# literals in failure messages, and breaking them hurts the one thing they are
# for.
line-length = 100

# The formatter only. Linting is a separate decision with a separate gate, and
# this file does not pretend otherwise: enabling a ruleset nobody has run would
# produce a red tree on day one and an ignored check after that.
[tool.ruff.format]
# Preserve the blank-line conventions the existing files already use.
docstring-code-format = false
# The suite's own markers are declared HERE, with --strict-markers, so an unknown or unregistered
# mark is an error rather than a warning. A conftest `pytest_configure` registering them was once
# shadowed by a later import of another `pytest_configure`: `slow` went unregistered, `-m "not
# slow"` kept silently working, and the only sign was a warnings line nobody reads.
[tool.pytest.ini_options]
addopts = "--strict-markers"
markers = [
    "slow: needs a real toolchain (swiftlint, a release build); skip with -m 'not slow'",
    "xdist_group: pin tests to one worker under --dist loadgroup (also declared by pytest-xdist)",
]
