# Python tooling configuration for the gate estate.
#
# This file exists because `check_python_formatted.py` resolves ruff's settings
# from the tree it runs in. With no configuration, ruff applied its defaults, so
# the shape of every Python file here was decided by whichever hand last edited
# it -- and the check reported 129 of 148 files unformatted while no gate ran it
# over this repository. A checker that is right about the answer and nobody asks
# it is not a gate.
#
# `[tool.ruff]` below is therefore a DECLARATION, not a preference: it is what
# "formatted" means here, so the answer stops depending on ruff's version and on
# the directory the command was launched from.
[tool.ruff]
# 100 matches the Rust side's `max_width` (see rustfmt.toml), so a line that is
# readable in one language is readable in the other. ruff's default is 88, which
# wraps the existing code for no gain: these files are mostly long string
# literals in failure messages, and breaking them hurts the one thing they are
# for.
line-length = 100

# The linter: ruff's DEFAULT rule set, with no `select` here (G17, 2026-10-26). It was ONE rule
# (PLW1510) while the tree reported 600-900 findings under the defaults that no step ran, so a
# redefined name, an unused import, a stale `noqa` and an unsorted import block all passed. The tree
# is clean under the defaults now and `ruff check .` is a GOH_CI_STEPS step, so a new finding is red.
# This is goh's OWN configuration: the shared consumer gate (py_gate.sh) runs each project's own
# rule set. Naming a rule here narrows or widens the defaults; leaving the key out follows ruff.
[tool.ruff.lint]

# Fixtures are DATA that checkers are run against (tests/test_screen_presentation.py reads these
# three for what they do not say); rewriting them to satisfy the linter changes the test's subject.
#
# F811 (redefined-while-unused) is off in the files that share a pytest FIXTURE by importing it
# (`from test_proven import repo, goh  # noqa: F401`) and then take it as a test parameter, which
# F811 reads as the parameter redefining an unused import: 90 findings, every one of that shape,
# none a shadowed test. What F811 is for in a test file -- a second `def test_x` replacing the
# first, which then never runs -- is checked WITHOUT the exemption, tree-wide, by
# tests/test_no_shadowed_defs.py. The fixtures themselves belong in a conftest or a kit module
# once a second module needs them; moving them is a separate change.
[tool.ruff.lint.per-file-ignores]
"tests/fixtures/**" = ["ALL"]
"tests/test_eval_transport.py" = ["F811"]
"tests/test_eval_transport_sweep.py" = ["F811"]
"tests/test_golden_core.py" = ["F811"]
"tests/test_golden_core_cli.py" = ["F811"]
"tests/test_head_export_prune.py" = ["F811"]
"tests/test_proven_artifacts.py" = ["F811"]
"tests/test_release_kit_ci.py" = ["F811"]
"tests/test_release_kit_tap.py" = ["F811"]

# `from m import a as b, c` stays one statement: splitting it added a line to a file at the 500-line cap.
[tool.ruff.lint.isort]
combine-as-imports = true

# The formatter.
[tool.ruff.format]
# Preserve the blank-line conventions the existing files already use.
docstring-code-format = false
# The suite's own markers are declared HERE, with --strict-markers, so an unknown or unregistered
# mark is an error rather than a warning. A conftest `pytest_configure` registering them was once
# shadowed by a later import of another `pytest_configure`: `slow` went unregistered, `-m "not
# slow"` kept silently working, and the only sign was a warnings line nobody reads.
[tool.pytest.ini_options]
addopts = "--strict-markers"
markers = [
    "slow: needs a real toolchain (swiftlint, a release build); skip with -m 'not slow'",
    "xdist_group: pin tests to one worker under --dist loadgroup (also declared by pytest-xdist)",
]
