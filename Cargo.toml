[workspace]
resolver = "2"
members = ["crates/goh", "crates/goh-testkit", "crates/goh-golden", "crates/goh-sys"]

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
exit = "warn"

# `unsafe_code` is denied at each crate ROOT (`#![deny(unsafe_code)]`), not here: crates/goh-sys is
# the FFI boundary and inherits every other workspace lint (`goh lints` refuses a crate that does
# not); tests/test_unsafe_scope.py holds `unsafe` to its one file.

[workspace.package]
version = "0.25.1"
edition = "2021"
rust-version = "1.85"
license = "MIT"
