          GOH_PY="$py" "$py" gates/ruff_agree.py --pin "$GOH_CI_RUFF"
          # Every pip install is a manifest pin (GOH.PYTESTPIN): the manifest's own lines above
          # carry `==X.Y.Z` (pytest-xdist is a goh-suite row), and tools/pytest.sh refuses a box on
          # another release. tests/test_ci_install_pins.py reds an install here that is not one.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cov-part-*
          merge-multiple: true
          path: target/cov-merge
      # Every part merged and judged as one run judges it: the floor, the per-crate summary, the
      # change's lines; red when a part is missing.
      - name: The coverage floor over every part
        run: ./gates/rust_gate.sh
        env:
          GOH_RUST_GROUPS: coverage
          GOH_COV_PARTS_IN: target/cov-merge
