name: gate

# ONE job, ONE command: `tools/gate.sh --full`, the command the pre-push hook runs (it execs
# gates/local_ci.sh over .gatesrc's GOH_CI_STEPS), so the hosted run and the local gate cannot
# disagree about what green means (CI.PUBLIC2, owner ruling 2026-11-08: "Yes, public repos").
# This repo IS the gates, so the gate is its own tree: no second checkout of gates_of_heck.
#
# macOS on Apple silicon, the platform the house ships for (house rule 3). Every action is pinned
# to a released tag's commit, the tag beside it, never a moving tag; raise one in its own commit.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    runs-on: macos-26
    timeout-minutes: 75
    env:
      CARGO_TERM_COLOR: never
      # The step ceiling is this MACHINE's budget, set here like GOH_GATE_SLOTS, never in
      # .gatesrc (where it would loosen the owner's 16-core hang detector too). Measured
      # 2026-11-10: ./gates/rust_gate.sh is 255 s wall and 1585 s CPU on the owner's machine; the
      # 3-core runner ran it out of the 900 s default (run 42916888942), so 2700 s is the CPU
      # time over 3 cores at under half the owner's per-core speed, rounded up.
      GOH_LCI_TIMEOUT: "2700"
      # A failed step's output, whole: local_ci prints a 30-line tail and keeps the full log on the
      # machine, which a hosted runner deletes when the job ends. Run 42930175911 named 12 of its
      # 90 red tests and the rest were lost. Like the ceiling, a property of THIS machine.
      GOH_TAIL: "100000"
    steps:
      # persist-credentials: false: the structural gate refuses a job token left in git config,
      # and nothing after the clone needs it. fetch-depth 0: the gate reads history (tags, the
      # changelog's versions, crates-behind's "since HEAD's parent").
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: GOH_DIR is this checkout
        run: echo "GOH_DIR=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
      # The tool floors (python3, shellcheck), from this tree's own gates/required_tools.tsv.
      - name: Meet goh's tool floors
        uses: ./.github/actions/goh-floors
      - name: Rust toolchain from rust-toolchain.toml
        run: |
          rustup toolchain install
          rustc -V
          cargo clippy -V
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # The gate's own manifest, never a copy of it: captured under pipefail, then each install
      # line run under `bash -eux`, so a failed install fails the step.
      - name: Install the tools the gate requires
        run: |
          set -euo pipefail
          cmds="$(python3 gates/required_tools.py --repo . --install)"
          printf '%s\n' "$cmds"
          grep -v '^#' <<<"$cmds" | bash -eux
          # The suite's parallel runner: an accelerator, not a requirement (tools/pytest.sh runs
          # serial without it), so not a manifest row -- but serial, the coverage group's suite
          # outruns local_ci's step ceiling. Into the house interpreter, the one the suite runs.
          "$(bash lib/house_python.sh)" -m pip install pytest-xdist
      - name: The gate
        run: ./tools/gate.sh --full
