[package]
name = "goh"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Static goh binary — structural gates without interpreter drift"

[[bin]]
name = "goh"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
bytecount = "0.6"
clap = { version = "4", features = ["derive"] }
goh-golden = { path = "../goh-golden" }
goh-sys = { path = "../goh-sys" }
num-traits = "0.2"
regex = "1"
ruff_python_ast = "0.0.16"
ruff_python_parser = "0.0.16"
ruff_text_size = "0.0.16"
# YAML for `goh checkout-credentials`: a workflow's structure (block scalars, flow maps, anchors)
# decides which `uses:` is a step, and a line scan guesses at it. No encoding_rs: input is UTF-8.
saphyr = { version = "0.1.0", default-features = false }
fancy-regex = "0.19.2"
serde_json = { version = "1", features = ["preserve_order"] }
signal-hook = "0.4.5"
sha2 = "0.11"
toml = { version = "1", features = ["preserve_order"] }
unicode-normalization = "0.1"

[dev-dependencies]
goh-testkit = { path = "../goh-testkit" }
png = "0.18"
tempfile = "3"
