[package]
name = "goh"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Static goh binary — structural gates without interpreter drift"

[[bin]]
name = "goh"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
bytecount = "0.6"
clap = { version = "4", features = ["derive"] }
goh-golden = { path = "../goh-golden" }
num-traits = "0.2"
regex = "1"
serde_json = "1"

[dev-dependencies]
goh-testkit = { path = "../goh-testkit" }
png = "0.18"
tempfile = "3"
