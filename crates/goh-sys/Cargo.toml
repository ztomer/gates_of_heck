[package]
name = "goh-sys"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The one place gates_of_heck calls into libc: what safe std cannot do"
publish = false

# The workspace's lints, inherited: `unsafe_code` is denied at the OTHER crates' roots, not by the
# workspace, so this FFI crate can inherit everything else (`goh lints`); tests/test_unsafe_scope.py
# holds `unsafe` to src/lib.rs here.
[lints]
workspace = true

[dependencies]
libc = "0.2.190"
